[workspace]
resolver = "3"
members = [
    "ch01-ownership",
    "ch02-trait-design",
    "ch03-generics",
    "ch04-error-handling",
    "ch05-concurrency",
    "ch06-async-tokio",
    "ch07-rayon",
    "ch08-paradigm",
    "ch09-criterion",
    "ch10-memory-opt",
    "ch11-web-crawler",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["森川 陽介"]
license = "MIT"
repository = "https://github.com/forest6511/rust-textbook-advanced-examples"

# 章横断で共有する依存関係。各章は必要なものだけ取り込む。
[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
rayon = "1.12"
criterion = { version = "0.8", features = ["html_reports"] }
anyhow = "1.0"
thiserror = "2.0"
parking_lot = "0.12"
crossbeam = "0.8"
crossbeam-channel = "0.5"
smallvec = "1.15"
async-trait = "0.1"
pin-project = "1.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

# Ch.11 (web-crawler) のみ
reqwest = { version = "0.13", features = ["json"] }
scraper = "0.26"
rusqlite = { version = "0.39", features = ["bundled"] }
governor = "0.10"
backon = "1.6"
indicatif = "0.18"
wiremock = "0.6"

# 並行処理章のデバッグ用
loom = "0.7"

[profile.bench]
debug = true  # criterion + flamegraph のため
