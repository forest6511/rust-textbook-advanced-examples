[package]
name = "ch10-memory-opt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
smallvec = { workspace = true }
bumpalo = { version = "3.20", features = ["collections"] }
memmap2 = "0.9"
dhat = "0.3"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "capacity"
harness = false

[[bench]]
name = "log_parser"
harness = false

[[bin]]
name = "demo"
path = "src/main.rs"

[[example]]
name = "dhat_profile"
path = "examples/dhat_profile.rs"
